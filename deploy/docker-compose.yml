version: '3.8'

services:
  timesheet-api:
    build:
      context: ./src/backend/TimesheetTracker.API
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TimesheetTrackerDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
    depends_on:
      - sqlserver
    networks:
      - timesheet-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - timesheet-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - timesheet-network

volumes:
  sqlserver_data:

networks:
  timesheet-network:
    driver: bridge
