trigger:
  branches:
    include:
    - main
    - develop

variables:
  buildConfiguration: 'Release'
  dotNetFramework: 'net8.0'
  dotNetVersion: '8.0.x'
  targetRuntime: 'linux-x64'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK'
      inputs:
        version: $(dotNetVersion)
        includePreviewVersions: true
    
    - task: DotNetCoreCLI@2
      displayName: 'Restore packages'
      inputs:
        command: 'restore'
        projects: 'src/backend/TimesheetTracker.API/TimesheetTracker.API.csproj'
    
    - task: DotNetCoreCLI@2
      displayName: 'Build application'
      inputs:
        command: 'build'
        projects: 'src/backend/TimesheetTracker.API/TimesheetTracker.API.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'
    
    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: 'tests/MyDotNetApp.Tests/MyDotNetApp.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --logger trx --results-directory $(Agent.TempDirectory)'
    
    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)'
    
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    
    - task: DotNetCoreCLI@2
      displayName: 'Publish application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/backend/TimesheetTracker.API/TimesheetTracker.API.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --runtime $(targetRuntime) --self-contained false'
        zipAfterPublish: true
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: SecurityScan
  displayName: 'Security Scanning'
  dependsOn: Build
  jobs:
  - job: SecurityScan
    displayName: 'Security Scan'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK'
      inputs:
        version: $(dotNetVersion)
    
    - task: DotNetCoreCLI@2
      displayName: 'Install security scan tool'
      inputs:
        command: 'custom'
        custom: 'tool'
        arguments: 'install --global security-scan'
    
    - script: |
        security-scan src/backend/TimesheetTracker.API --output $(Build.ArtifactStagingDirectory)/security-report.json
      displayName: 'Run security scan'
      continueOnError: true
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish security report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/security-report.json'
        ArtifactName: 'security-report'

- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: 
  - Build
  - SecurityScan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy to Staging'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(Azure.ServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(Azure.WebApp.Name)-staging'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              runtimeStack: 'DOTNETCORE|8.0'

- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: 
  - Build
  - SecurityScan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy to Production'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(Azure.ServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(Azure.WebApp.Name)'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              runtimeStack: 'DOTNETCORE|8.0'
          
          - task: AzureCLI@2
            displayName: 'Health Check'
            inputs:
              azureSubscription: '$(Azure.ServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                sleep 30
                response=$(curl -s -o /dev/null -w "%{http_code}" https://$(Azure.WebApp.Name).azurewebsites.net/health)
                if [ $response != "200" ]; then
                  echo "Health check failed with status code: $response"
                  exit 1
                fi
                echo "Health check passed"
